site_name: Algo
site_description: 算法竞赛与题解知识库：从朴素思路到最优解
site_author: WineChord
site_url: https://www.wineandchord.com/algo/
repo_name: WineChord/algo
repo_url: https://github.com/WineChord/algo
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2021–2026 WineChord

theme:
  name: material
  language: zh
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  font: false
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      lang:
        - zh
        - en
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WineChord
      name: WineChord on GitHub

nav:
  - 首页: index.md
  - 入门与方法:
      - 学习路线: guide/roadmap.md
      - 解题方法: guide/problem-solving.md
      - 复杂度分析: guide/complexity.md
      - 竞赛 C++: guide/cpp.md
  - 基础技巧:
      - 知识地图: basics/index.md
      - 序列扫描与不变量: basics/sequence-invariants.md
      - 前缀状态与差分: basics/prefix-sums-and-difference.md
      - 极值候选与 Top-K: basics/top-k-extrema.md
      - 非负两数乘积: basics/pair-product-extrema.md
      - 有符号乘积: basics/signed-product-extrema.md
      - 二分查找: basics/binary-search.md
  - 数据结构:
      - 知识地图: data-structures/index.md
      - 哈希分组与 LRU: data-structures/hash-and-cache.md
  - 图论:
      - 知识地图: graph/index.md
      - 0-1 权与奇偶状态: graph/weighted-parity-states.md
      - 树上后序聚合: graph/tree-aggregation.md
  - 动态规划:
      - 知识地图: dp/index.md
      - 线性递推: dp/linear-recurrences.md
      - 双序列动态规划: dp/sequence-dp.md
  - 数学:
      - 知识地图: math/index.md
      - 前缀余数与模构造: math/modular-constructions.md
  - 字符串:
      - 知识地图: strings/index.md
      - 回文中心与半径: strings/palindrome-centers.md
  - 题解:
      - 题解索引: problems/index.md
      - 写作模板: problems/template.md
  - 资源: resources.md
  - 更新日志: changelog.md
