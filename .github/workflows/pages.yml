name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          npm ci
      - name: Check content
        run: python scripts/check_content.py
      - name: Check copy typography
        run: python scripts/check_typography.py
      - name: Check figures and provenance
        run: python scripts/check_figures.py
      - name: Compile C++ snippets
        run: python scripts/check_cpp.py
      - name: Check Markdown and mathematics
        run: python scripts/check_rendering.py
      - name: Build site
        run: mkdocs build --strict
      - name: Check generated and browser rendering
        run: python scripts/check_rendering.py --site-dir site --browser
      - name: Check generated figure placements
        run: python scripts/check_figures.py --site-dir site
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
