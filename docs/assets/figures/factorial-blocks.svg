<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">排列字典序的阶乘块</title>
  <desc id="figure-desc">固定前缀后每个候选值对应一个连续的后缀排列块。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="490" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>固定前缀后，全部后缀排列形成连续字典序块</text>
  <rect x="66" y="100" width="196" height="116" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="164" y="142" fill="#2563eb" font-size="18" font-weight="700" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>首位选 1</text>
  <text x="164" y="178" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>后缀共有 3! 种</text>
  <text x="164" y="202" fill="#2563eb" font-size="14" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>排名区间 [0, 5]</text>
  <rect x="276" y="100" width="196" height="116" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
  <text x="374" y="142" fill="#0f766e" font-size="18" font-weight="700" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>首位选 2</text>
  <text x="374" y="178" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>后缀共有 3! 种</text>
  <text x="374" y="202" fill="#0f766e" font-size="14" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>排名区间 [6, 11]</text>
  <rect x="486" y="100" width="196" height="116" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="584" y="142" fill="#c2410c" font-size="18" font-weight="700" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>首位选 3</text>
  <text x="584" y="178" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>后缀共有 3! 种</text>
  <text x="584" y="202" fill="#c2410c" font-size="14" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>排名区间 [12, 17]</text>
  <rect x="696" y="100" width="196" height="116" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="794" y="142" fill="#6d28d9" font-size="18" font-weight="700" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>首位选 4</text>
  <text x="794" y="178" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>后缀共有 3! 种</text>
  <text x="794" y="202" fill="#6d28d9" font-size="14" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>排名区间 [18, 23]</text>
  <text x="68" y="278" fill="#172033" font-size="19" font-weight="650" text-anchor="start" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>目标排列 3 1 4 2</text>
  <rect x="68" y="316" width="124" height="36" rx="18" fill="#dbeafe" stroke="#dbeafe" stroke-width="1"/>
  <text x="130" y="340" fill="#2563eb" font-size="15" font-weight="600" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>c₀ = 2</text>
  <text x="216" y="340" fill="#5f6b7a" font-size="15" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>跳过首位 1、2 的两个 3! 块</text>
  <rect x="68" y="370" width="124" height="36" rx="18" fill="#f4f7fa" stroke="#f4f7fa" stroke-width="1"/>
  <text x="130" y="394" fill="#172033" font-size="15" font-weight="600" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>c₁ = 0</text>
  <text x="216" y="394" fill="#5f6b7a" font-size="15" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>剩余值中没有比 1 更小者</text>
  <rect x="68" y="424" width="124" height="36" rx="18" fill="#f4f7fa" stroke="#f4f7fa" stroke-width="1"/>
  <text x="130" y="448" fill="#172033" font-size="15" font-weight="600" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>c₂ = 1</text>
  <text x="216" y="448" fill="#5f6b7a" font-size="15" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>跳过一个 1! 块</text>
  <rect x="624" y="310" width="264" height="112" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="644" y="341" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>Lehmer 码</text>
  <text x="644" y="367" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>rank = Σ cᵢ · (n-i-1)!</text>
</svg>
