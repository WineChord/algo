  <text x="380" y="298" fill="#172033" font-size="12" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f0</text>
  <rect x="404" y="270" width="40" height="44" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="424" y="298" fill="#172033" font-size="12" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f1</text>
  <rect x="448" y="270" width="40" height="44" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="468" y="298" fill="#172033" font-size="12" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f2</text>
  <rect x="492" y="270" width="40" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="512" y="298" fill="#172033" font-size="12" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f3</text>
  <rect x="536" y="270" width="40" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="556" y="298" fill="#172033" font-size="12" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f4</text>
  <rect x="580" y="270" width="40" height="44" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="298" fill="#172033" font-size="12" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f5</text>
  <text x="486" y="344" fill="#2563eb" font-size="15" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>按依赖方向填表</text>
  <rect x="728" y="254" width="68" height="68" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <rect x="814" y="254" width="68" height="68" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="762" y="295" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>a</text>
  <text x="848" y="295" fill="#0f766e" font-size="22" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>b</text>
  <line x1="798" y1="288" x2="808" y2="288" stroke="#0f766e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="805" y="354" fill="#0f766e" font-size="15" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>新值只依赖最近状态</text>
  <text x="480" y="442" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>空间压缩改变存储，不改变状态定义、转移和正确性。</text>
</svg>
