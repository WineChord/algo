<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">线性递推的状态压缩</title>
  <desc id="figure-desc">递归树先去重成递推表，再按依赖窗口压缩为滚动状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>优化存储之前，先看清状态依赖</text>
  <rect x="54" y="92" width="214" height="78" rx="12" fill="#fee4e2" stroke="#b42318" stroke-width="2"/>
  <text x="74" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>递归树</text>
  <text x="74" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>重复展开相同子问题</text>
  <rect x="374" y="92" width="214" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="394" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>记忆 / 递推表</text>
  <text x="394" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>每个状态只计算一次</text>
  <rect x="694" y="92" width="214" height="78" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="714" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>滚动状态</text>
  <text x="714" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>只保留下一步仍依赖的值</text>
  <line x1="268" y1="131" x2="362" y2="131" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="588" y1="131" x2="682" y2="131" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="160" cy="240" r="24" fill="#fee4e2" stroke="#b42318" stroke-width="2"/>
  <text x="160" y="247" fill="#172033" font-size="16" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f₅</text>
  <circle cx="104" cy="308" r="22" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="104" y="315" fill="#172033" font-size="14" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f₄</text>
  <line x1="148" y1="260" x2="104" y2="286" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="216" cy="308" r="22" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="216" y="315" fill="#172033" font-size="14" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f₃</text>
  <line x1="172" y1="260" x2="216" y2="286" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="372" r="20" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="160" y="378" fill="#172033" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>f₃</text>
  <line x1="116" y1="326" x2="148" y2="354" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
