<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">常见复杂度增长趋势</title>
  <desc id="figure-desc">线性、线性对数、平方和指数增长率随输入规模增加而分离。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="52" y="46" fill="#172033" font-size="24" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>输入规模增加时，不同增长率迅速分离</text>
  <line x1="94" y1="390" x2="874" y2="390" stroke="#172033" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="94" y1="390" x2="94" y2="88" stroke="#172033" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="878" y="414" fill="#172033" font-size="18" font-weight="600" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>n</text>
  <text x="54" y="80" fill="#172033" font-size="16" font-weight="600" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>工作量</text>
  <line x1="220" y1="390" x2="220" y2="398" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
  <text x="220" y="422" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>小</text>
  <line x1="450" y1="390" x2="450" y2="398" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
  <text x="450" y="422" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>中</text>
  <line x1="680" y1="390" x2="680" y2="398" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
  <text x="680" y="422" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>大</text>
  <path d="M 102 367 C 300 362, 600 350, 852 332" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="835" y="322" fill="#0f766e" font-size="17" font-weight="700" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>n</text>
  <path d="M 102 370 C 290 365, 560 330, 852 260" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="840" y="250" fill="#2563eb" font-size="17" font-weight="700" text-anchor="end" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>n log n</text>
  <path d="M 102 374 C 360 368, 655 300, 852 135" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="845" y="126" fill="#c2410c" font-size="17" font-weight="700" text-anchor="end" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>n²</text>
  <path d="M 102 376 C 450 374, 700 324, 812 92" fill="none" stroke="#b42318" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="84" fill="#b42318" font-size="17" font-weight="700" text-anchor="end" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>2ⁿ</text>
  <line x1="724" y1="104" x2="724" y2="390" stroke="#c8d1dc" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/>
  <text x="712" y="116" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="end" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>同一时间预算</text>
  <text x="94" y="457" fill="#5f6b7a" font-size="15" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>示意图只比较增长趋势；实际边界还取决于常数、语言、内存与测试组数。</text>
</svg>
