<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">算法解题闭环</title>
  <desc id="figure-desc">从题目契约、朴素解和瓶颈分析走向不变量、证明、实现与测试。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="52" y="48" fill="#172033" font-size="24" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>从可解释的暴力，到可验证的最优</text>
  <rect x="54" y="92" width="240" height="84" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="74" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>题目契约</text>
  <text x="74" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>输入 · 输出 · 约束</text>
  <rect x="360" y="92" width="240" height="84" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="380" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>朴素解</text>
  <text x="380" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>完整覆盖选择空间</text>
  <rect x="666" y="92" width="240" height="84" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="686" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>定位瓶颈</text>
  <text x="686" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>重复计算 · 无序候选 · 冗余状态</text>
  <rect x="666" y="236" width="240" height="84" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="686" y="267" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>建立不变量</text>
  <text x="686" y="293" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>只保留仍会影响未来的信息</text>
  <rect x="360" y="236" width="240" height="84" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="380" y="267" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>证明与实现</text>
  <text x="380" y="293" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>边界语义与转移保持一致</text>
  <rect x="54" y="236" width="240" height="84" rx="12" fill="#fee4e2" stroke="#b42318" stroke-width="2"/>
  <text x="74" y="267" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>测试与复盘</text>
  <text x="74" y="293" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>极值 · 对拍 · 约束迁移</text>
  <line x1="294" y1="134" x2="348" y2="134" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="600" y1="134" x2="654" y2="134" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="786" y1="176" x2="786" y2="224" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="666" y1="278" x2="612" y2="278" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="360" y1="278" x2="306" y2="278" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 174 326 C 174 392, 30 392, 30 134 C 30 82, 54 78, 78 78" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="480" y="372" fill="#2563eb" font-size="17" font-weight="600" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>反例或性能不达标时，回到最早失效的假设</text>
  <rect x="323" y="400" width="150" height="36" rx="18" fill="#dbeafe" stroke="#dbeafe" stroke-width="1"/>
  <text x="398" y="424" fill="#2563eb" font-size="15" font-weight="600" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>正确性</text>
  <rect x="486" y="400" width="150" height="36" rx="18" fill="#ccfbf1" stroke="#ccfbf1" stroke-width="1"/>
  <text x="561" y="424" fill="#0f766e" font-size="15" font-weight="600" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>复杂度</text>
  <text x="480" y="458" fill="#5f6b7a" font-size="17" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>每次优化都应同时回答：为什么更快？为什么仍然正确？</text>
</svg>
