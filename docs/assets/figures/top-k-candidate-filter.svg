<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Top-K 候选过滤</title>
  <desc id="figure-desc">输入流经过大小为 k 的候选集，永久淘汰不可能进入答案的元素。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>只保留仍可能进入最终答案的候选</text>
  <circle cx="58" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="58" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>4</text>
  <circle cx="128" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="128" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>1</text>
  <circle cx="198" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="198" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>9</text>
  <circle cx="268" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="268" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>3</text>
  <circle cx="338" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="338" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>8</text>
  <circle cx="408" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="408" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
  <circle cx="478" cy="124" r="25" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="478" y="131" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>7</text>
  <text x="58" y="82" fill="#5f6b7a" font-size="16" font-weight="600" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>输入流</text>
  <line x1="556" y1="124" x2="642" y2="124" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="652" y="86" width="250" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="672" y="117" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>大小为 k 的候选集</text>
  <text x="672" y="143" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>队首是最容易被淘汰者</text>
  <text x="74" y="248" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>读到新值 x</text>
  <rect x="228" y="210" width="206" height="76" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="248" y="241" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>候选未满</text>
  <text x="248" y="267" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>直接加入 x</text>
  <rect x="520" y="210" width="206" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="540" y="241" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>x &gt; 当前最小</text>
  <text x="540" y="267" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>淘汰最小，再加入 x</text>
  <rect x="374" y="332" width="206" height="76" rx="12" fill="#f4f7fa" stroke="#5f6b7a" stroke-width="2"/>
  <text x="394" y="363" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>x ≤ 当前最小</text>
  <text x="394" y="389" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>永久丢弃 x</text>
  <path d="M 176 252 C 194 252, 200 248, 218 248" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 176 260 C 340 302, 430 302, 510 260" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 622 294 C 622 326, 590 348, 590 348" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="480" y="452" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>被第 k 大阈值压住的历史元素，以后不会因只插入而重新成为候选。</text>
</svg>
