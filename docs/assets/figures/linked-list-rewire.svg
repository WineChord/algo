<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">单链表局部接线</title>
  <desc id="figure-desc">反转当前边之前保存后继，从而不丢失尚未处理后缀。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>改写 next 之前，先保存尚未处理后缀的入口</text>
  <rect x="124" y="114" width="78" height="52" rx="8" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="163" y="147" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>1</text>
  <line x1="204" y1="140" x2="274" y2="140" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="280" y="114" width="78" height="52" rx="8" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="319" y="147" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
  <line x1="360" y1="140" x2="430" y2="140" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="436" y="114" width="78" height="52" rx="8" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="475" y="147" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>3</text>
  <line x1="516" y1="140" x2="586" y2="140" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="592" y="114" width="78" height="52" rx="8" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="631" y="147" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>4</text>
  <line x1="672" y1="140" x2="742" y2="140" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="748" y="114" width="78" height="52" rx="8" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="787" y="147" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>5</text>
  <text x="124" y="94" fill="#2563eb" font-size="15" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>prev</text>
  <text x="280" y="94" fill="#c2410c" font-size="15" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>current</text>
  <text x="436" y="94" fill="#0f766e" font-size="15" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>next</text>
  <path d="M 318 190 C 290 252, 222 252, 202 190" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="260" y="280" fill="#c2410c" font-size="16" font-weight="650" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>current-&gt;next = prev</text>
  <line x1="436" y1="214" x2="590" y2="214" stroke="#0f766e" stroke-width="4" stroke-linecap="round"/>
  <text x="513" y="246" fill="#0f766e" font-size="15" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>未处理后缀仍可达</text>
  <rect x="90" y="330" width="226" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="361" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>已反转前缀</text>
  <text x="110" y="387" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>由 prev 指向</text>
  <rect x="367" y="330" width="226" height="78" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="387" y="361" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>当前局部接线</text>
  <text x="387" y="387" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>只修改一条边</text>
  <rect x="644" y="330" width="226" height="78" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="664" y="361" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>未处理后缀</text>
  <text x="664" y="387" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>由 next 保留入口</text>
</svg>
