<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">LRU 的哈希表与双向链表</title>
  <desc id="figure-desc">哈希表负责按键定位，双向链表负责维护最近使用顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>定位与顺序是两种不同的信息，需要两种结构协作</text>
  <rect x="58" y="102" width="238" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="78" y="133" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>哈希表</text>
  <text x="78" y="159" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>key → 稳定节点引用</text>
  <rect x="82" y="220" width="80" height="48" rx="7" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="122" y="251" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>A</text>
  <rect x="82" y="282" width="80" height="48" rx="7" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="122" y="313" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>B</text>
  <rect x="82" y="344" width="80" height="48" rx="7" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="122" y="375" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>C</text>
  <text x="82" y="292" fill="#2563eb" font-size="16" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>O(1) 定位</text>
  <rect x="376" y="188" width="112" height="64" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="432" y="228" fill="#0f766e" font-size="20" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>C</text>
  <text x="432" y="172" fill="#0f766e" font-size="14" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>MRU</text>
  <rect x="520" y="188" width="112" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="576" y="228" fill="#2563eb" font-size="20" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>A</text>
  <rect x="664" y="188" width="112" height="64" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
  <text x="720" y="228" fill="#c2410c" font-size="20" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>B</text>
  <text x="720" y="172" fill="#c2410c" font-size="14" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>LRU</text>
  <line x1="488" y1="220" x2="514" y2="220" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="632" y1="220" x2="658" y2="220" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="658" y1="240" x2="632" y2="240" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="514" y1="240" x2="488" y2="240" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="538" y="292" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>双向链表维护从新到旧的顺序</text>
  <path d="M 164 244 C 260 244, 260 220, 712 220" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 164 306 C 260 306, 260 220, 568 220" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 164 368 C 260 368, 260 220, 424 220" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="382" y="370" width="394" height="72" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="402" y="401" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>一次命中</text>
  <text x="402" y="427" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>哈希定位节点 → 从原位置摘除 → 移到 MRU</text>
</svg>
