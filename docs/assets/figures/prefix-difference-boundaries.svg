<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">差分的区间边界事件</title>
  <desc id="figure-desc">区间加法在左边界开始、右边界之后撤销，再由前缀和恢复。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>区间信息可以留在两个边界，再由前缀扫描恢复</text>
  <rect x="72" y="104" width="86" height="58" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="115" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
