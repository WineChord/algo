  <text x="851" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>8</text>
  <line x1="256" y1="194" x2="710" y2="194" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="483" y="222" fill="#2563eb" font-size="16" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>给区间 [l, r] 整体加 v</text>
  <line x1="256" y1="244" x2="256" y2="288" stroke="#0f766e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="710" y1="244" x2="710" y2="288" stroke="#c2410c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="184" y="304" width="180" height="70" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="204" y="335" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>diff[l] += v</text>
  <text x="204" y="361" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>贡献从这里开始</text>
  <rect x="602" y="304" width="198" height="70" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="622" y="335" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>diff[r + 1] -= v</text>
  <text x="622" y="361" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>贡献从这里撤销</text>
  <path d="M 300 402 C 410 446, 560 446, 670 402" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="330" y="442" width="308" height="30" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
  <text x="484" y="465" fill="#6d28d9" font-size="16" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>一次前缀和恢复每个位置的净增量</text>
</svg>
