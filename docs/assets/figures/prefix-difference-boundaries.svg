  <text x="207" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>1</text>
  <text x="207" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>1</text>
  <rect x="256" y="104" width="86" height="58" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="299" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>0</text>
  <text x="299" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
  <rect x="348" y="104" width="86" height="58" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="391" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>3</text>
  <text x="391" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>3</text>
  <rect x="440" y="104" width="86" height="58" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="483" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>0</text>
  <text x="483" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>4</text>
  <rect x="532" y="104" width="86" height="58" rx="5" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="575" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
  <text x="575" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>5</text>
