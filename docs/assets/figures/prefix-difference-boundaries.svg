  <text x="667" y="140" fill="#172033" font-size="17" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>1</text>
  <text x="667" y="186" fill="#5f6b7a" font-size="13" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>6</text>
