<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">图算法选择路径</title>
  <desc id="figure-desc">按可达性、边权与负边条件选择 DFS、BFS、0-1 BFS、Dijkstra 或其他工具。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>先识别边的语义，再选择遍历或最短路工具</text>
  <rect x="62" y="92" width="228" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>只问可达 / 连通？</text>
  <text x="82" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>DFS 或 BFS</text>
  <rect x="366" y="92" width="228" height="76" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="386" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>边权全部相同？</text>
  <text x="386" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>BFS 按层得到最短步数</text>
  <rect x="670" y="92" width="228" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="690" y="123" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>边权需要累计？</text>
  <text x="690" y="149" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>进入最短路分支</text>
  <line x1="290" y1="130" x2="354" y2="130" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="594" y1="130" x2="658" y2="130" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="90" y="254" width="218" height="78" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="110" y="285" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>权值只有 0 / 1</text>
  <text x="110" y="311" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>0-1 BFS · deque</text>
  <rect x="371" y="254" width="218" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="391" y="285" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>权值非负</text>
  <text x="391" y="311" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>Dijkstra · heap</text>
  <rect x="652" y="254" width="218" height="78" rx="12" fill="#fee4e2" stroke="#b42318" stroke-width="2"/>
  <text x="672" y="285" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>存在负边</text>
  <text x="672" y="311" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>Bellman–Ford / DAG</text>
  <path d="M 784 172 C 784 212, 760 222, 760 244" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 784 172 C 700 212, 500 212, 500 244" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M 784 172 C 620 204, 202 204, 202 244" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="480" y="418" fill="#5f6b7a" font-size="17" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>若目标、边权或状态含义改变，算法选择也必须重新证明。</text>
</svg>
