<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">非负两数乘积的信息压缩</title>
  <desc id="figure-desc">枚举、排序和前二扫描逐步减少不必要信息。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>从完整顺序中，只抽取答案真正需要的两项信息</text>
  <rect x="62" y="90" width="58" height="58" rx="6" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="91" y="126" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>3</text>
  <rect x="135" y="90" width="58" height="58" rx="6" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="164" y="126" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>5</text>
  <rect x="208" y="90" width="58" height="58" rx="6" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="237" y="126" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
  <rect x="281" y="90" width="58" height="58" rx="6" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="310" y="126" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>8</text>
  <rect x="354" y="90" width="58" height="58" rx="6" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="383" y="126" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>6</text>
  <rect x="427" y="90" width="58" height="58" rx="6" fill="#f4f7fa" stroke="#c8d1dc" stroke-width="2"/>
  <text x="456" y="126" fill="#172033" font-size="18" font-weight="400" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>9</text>
  <line x1="520" y1="119" x2="600" y2="119" stroke="#5f6b7a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="616" y="82" width="264" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="636" y="113" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>扫描状态</text>
  <text x="636" y="139" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>max₁ = 9, max₂ = 8</text>
  <rect x="72" y="230" width="224" height="92" rx="12" fill="#f4f7fa" stroke="#5f6b7a" stroke-width="2"/>
  <text x="92" y="261" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>枚举所有数对</text>
  <text x="92" y="287" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>O(n²) · 信息最完整</text>
  <rect x="368" y="230" width="224" height="92" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="388" y="261" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>排序全部元素</text>
  <text x="388" y="287" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>O(n log n) · 顺序过剩</text>
  <rect x="664" y="230" width="224" height="92" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="684" y="261" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>维护前二</text>
  <text x="684" y="287" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>O(n) · 恰好充分</text>
  <line x1="296" y1="276" x2="356" y2="276" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="592" y1="276" x2="652" y2="276" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="480" y="390" fill="#5f6b7a" font-size="16" font-weight="400" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>目标对两个非负因子都单调，因此任何非前二元素都可被更大的候选替换。</text>
</svg>
