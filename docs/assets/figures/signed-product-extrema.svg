<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">有符号三数乘积的双端候选</title>
  <desc id="figure-desc">最大乘积只需比较三个最大值与两个最小值加最大值。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="48" y="44" fill="#172033" font-size="23" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>负号使最大乘积同时依赖数轴两端</text>
  <line x1="82" y1="190" x2="876" y2="190" stroke="#172033" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="116" cy="190" r="22" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="116" y="197" fill="#c2410c" font-size="16" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>-10</text>
  <circle cx="178" cy="190" r="22" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
  <text x="178" y="197" fill="#c2410c" font-size="16" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>-10</text>
  <circle cx="574" cy="190" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="574" y="197" fill="#2563eb" font-size="16" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>1</text>
  <circle cx="664" cy="190" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="664" y="197" fill="#2563eb" font-size="16" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>2</text>
  <circle cx="754" cy="190" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="754" y="197" fill="#2563eb" font-size="16" font-weight="700" text-anchor="middle" font-family='"SFMono-Regular",Consolas,"Liberation Mono",monospace'>3</text>
  <path d="M 574 146 C 630 92, 704 92, 754 146" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="666" y="82" fill="#2563eb" font-size="17" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>h₃ · h₂ · h₁ = 6</text>
  <path d="M 116 236 C 252 332, 610 332, 754 236" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="432" y="350" fill="#c2410c" font-size="17" font-weight="650" text-anchor="middle" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>l₁ · l₂ · h₁ = 300</text>
  <rect x="158" y="390" width="252" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="178" y="421" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>三个最大值</text>
  <text x="178" y="447" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>覆盖三个非负或全负候选</text>
  <rect x="550" y="390" width="252" height="70" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="570" y="421" fill="#172033" font-size="18" font-weight="650" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>两个最小值 + 最大值</text>
  <text x="570" y="447" fill="#5f6b7a" font-size="14" font-weight="400" text-anchor="start" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'>覆盖一正两负候选</text>
</svg>
